<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="base" x1="0.15" y1="0.1" x2="0.85" y2="0.95">
      <stop offset="0" stop-color="#BDE7FF"/>
      <stop offset="0.35" stop-color="#5BA8FF"/>
      <stop offset="0.7" stop-color="#1769E8"/>
      <stop offset="1" stop-color="#0D4EC3"/>
    </linearGradient>
    <linearGradient id="left" x1="0.05" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#D5EEFF" stop-opacity="0.9"/>
      <stop offset="0.45" stop-color="#61AFFF" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#1265E5" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="right" x1="0.2" y1="0.1" x2="0.85" y2="1">
      <stop offset="0" stop-color="#E3F5FF" stop-opacity="0.82"/>
      <stop offset="0.55" stop-color="#78BEFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#2B78EE" stop-opacity="0.88"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.78"/>
      <stop offset="0.35" stop-color="#FFFFFF" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A9DCFF" stop-opacity="0.9"/>
      <stop offset="0.6" stop-color="#2E8BFF" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#0755D7" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#0B5BCE" flood-opacity="0.18"/>
    </filter>
  </defs>

