  <path d="M220 725C171 633 168 458 198 356C222 276 297 193 394 121C475 61 586 49 641 89C688 123 692 190 675 282C667 327 666 375 666 422C706 396 749 365 808 360C896 353 952 407 950 482C948 569 883 654 800 708C707 769 592 791 478 788C363 785 258 771 220 725Z" fill="#45A2FF" opacity="0.28" filter="url(#softGlow)"/>

