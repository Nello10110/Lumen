  <path d="M230 702C185 617 184 468 210 365C237 260 331 162 441 102C512 64 599 64 640 96C681 128 682 190 667 278C657 336 659 394 659 451C711 409 769 373 821 372C897 371 943 418 939 486C933 577 851 663 762 711C663 764 542 783 426 770C329 759 258 752 230 702Z" fill="url(#base)" stroke="url(#edge)" stroke-width="8" filter="url(#shadow)"/>

