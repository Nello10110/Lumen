<svg xmlns="http://www.w3.org/2000/svg" viewBox="269 52 744 744">
  <!-- Silhouette du logo Lumen (backlog § AF.1) : seul le contour principal de
       l'emblème "verre liquide" (frontend/src/components/LumenMark.tsx), sans le
       dégradé ni les reflets — un filigrane doit rester lisible en aplat très pâle,
       pas reproduire le rendu plein contraste du logo. Rasterisé en PNG via
       sharp-cli pour l'usage reportlab (services/pdf_watermark.py), l'opacité étant
       cuite dans les pixels (fill-opacity ci-dessous) plutôt que gérée côté canvas
       PDF, pour rester indépendante de la version de reportlab installée. -->
  <g transform="translate(600 150)">
    <path
      d="M-210 420 C-210 255 -165 105 -65 20 C-12 -25 50 -6 52 55 L52 314 C52 356 75 378 111 360 C170 330 232 325 267 355 C317 397 286 469 226 505 C156 548 60 555 -28 550 C-132 544 -210 502 -210 420Z"
      fill="#2874F0"
      fill-opacity="0.035"
    />
  </g>
</svg>
