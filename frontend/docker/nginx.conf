# Sert le bundle statique (SPA) et reverse-proxy /api/ vers le service backend Docker
# Compose (résolution par nom de service, "backend") — même principe que le proxy
# /api du serveur de dev Vite (frontend/vite.config.ts), juste avec la cible réseau
# Docker au lieu de 127.0.0.1. Le navigateur ne parle donc jamais qu'à CETTE seule
# origine : aucune requête cross-origin réelle dans ce déploiement.
server {
    listen 80;
    root /usr/share/nginx/html;

    location /api/ {
        # DOIT rester aligné sur `upload_limits.TAILLE_MAX_IMPORT_OCTETS` (25 Mo).
        # Sans cette directive, nginx applique son défaut de 1 Mo et rejette lui-même
        # la requête avec un 413, AVANT que l'application ne la voie : l'utilisateur
        # lisait « fichier trop volumineux » pour un fichier de 1,2 Mo que le backend
        # aurait parfaitement accepté, et aucun journal applicatif n'en portait la
        # trace. Défaut présent depuis la création de ce fichier, révélé le
        # 03/09/2026 par un export de transactions qui venait de franchir 1 Mo.
        # `tests/test_upload_limits.py` verrouille l'égalité des deux valeurs.
        client_max_body_size 25m;

        # `backend` est résolu À CHAQUE requête (cache de 5 s), pas une fois au démarrage
        # de nginx. Avec `proxy_pass http://backend:8000/...` en dur, nginx retient
        # l'adresse du backend telle qu'elle était à SON démarrage : dès que le backend est
        # recréé (`docker compose up -d` après une mise à jour de l'image) il change
        # d'adresse dans le réseau Docker, et chaque appel `/api` renvoyait un 502 jusqu'au
        # redémarrage de ce conteneur — l'écran de connexion affichait « impossible de
        # joindre le serveur » (correctif #88, démontré par le job `deploiement-postgres`
        # de la CI). 127.0.0.11 : le résolveur intégré de Docker.
        #
        # `proxy_pass` avec une variable, SANS chemin : nginx transmet l'URI de la requête
        # telle que le client l'a envoyée (`/api/...` et sa chaîne de requête), ce qui
        # revient exactement à l'ancien `.../api/` appliqué au préfixe `/api/`. Une seule
        # `location` est proxifiée ; délais d'expiration, tampons, corps de requête
        # (`client_max_body_size` ci-dessus) et en-têtes sont inchangés.
        resolver 127.0.0.11 valid=5s ipv6=off;
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }

    # Fichiers du build content-hashés dans leur nom (assets/index-XXXXXXXX.js) :
    # deux déploiements différents ne partagent jamais le même nom de fichier, une
    # mise en cache longue et "immutable" est donc sans risque — jamais de version
    # périmée servie sous un nom déjà vu (retour utilisateur du 10/09/2026, cf.
    # `MiseAJourDisponible.tsx` pour le pendant service worker de ce correctif).
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # `index.html`, `sw.js` et le manifeste ne sont PAS content-hashés : c'est
    # justement `index.html` qui référence les noms de fichiers hashés ci-dessus, et
    # `sw.js` qui décide quelle version le service worker doit précharger — les
    # servir avec une mise en cache par défaut (heuristique du navigateur) est
    # exactement ce qui pouvait laisser un visiteur sans service worker actif
    # (première visite, navigation privée...) bloqué sur l'ancienne version après un
    # déploiement. `no-cache` : revalidé à chaque requête (pas `no-store`, l'ETag/
    # Last-Modified de nginx permet un 304 sans retélécharger si rien n'a changé).
    location ~ ^/(index\.html|sw\.js|manifest\.webmanifest|registerSW\.js)$ {
        add_header Cache-Control "no-cache";
    }

    # Routage côté client (react-router-dom) : un rechargement sur une route comme
    # /patrimoine doit servir index.html, pas un 404 nginx.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
