name: Docker publish

# Construit et publie les deux images (backend, frontend) sur GitHub Container
# Registry a chaque push sur main touchant le code -- "deja build" pour le deploiement homelab
# (compose.yaml les tire au lieu de les construire, cf.
# docs/MANUEL_EXPLOITATION.md). Les deux packages sont publics depuis l'ouverture
# du depot : aucun docker login n'est necessaire pour les tirer.

# Filtre de chemins (backlog BO.1) : un push sur main ne publie que s'il touche le
# code des images (backend/, frontend/) ou ce workflow lui-meme (pour qu'une
# modification du workflow soit eprouvee par une vraie publication). Un commit de
# documentation ou de compose.yaml ne publie rien : le homelab, qui tire les images
# toutes les heures, ne recree alors plus ses conteneurs pour rien. Le declenchement
# manuel (workflow_dispatch) n'est pas concerne par le filtre.
on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/docker-publish.yml'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Resout le proprietaire en minuscules (exige par GHCR)
        run: echo "OWNER_LC=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build et push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/lumen-backend:latest
            ghcr.io/${{ env.OWNER_LC }}/lumen-backend:${{ github.sha }}

      - name: Build et push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/lumen-frontend:latest
            ghcr.io/${{ env.OWNER_LC }}/lumen-frontend:${{ github.sha }}
